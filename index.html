<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f6f5fb;background:#0b0b12;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}button{font:inherit}.prototype{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#201c36 0,#101019 48%,#09090e 100%)}.stage{width:min(100vw,calc(100vh * 852 / 393));aspect-ratio:852/393;position:relative;overflow:hidden;background:#6dc9ee url("assets/lobby-bg.png") center / cover no-repeat;container-type:inline-size}.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.015) 50%,transparent 70%);pointer-events:none}.top{position:absolute;inset:0 0 auto;height:17%;display:flex;align-items:center;padding:0 4.4%;justify-content:space-between}.brand{font-weight:850;font-size:clamp(15px,2.35cqw,24px);letter-spacing:-.07em}.brand i{font-style:normal;color:#b68cff}.top-label,.eyebrow,.footer{font-size:clamp(7px,1.05cqw,11px);letter-spacing:.14em;text-transform:uppercase}.top-label{color:#868395}.top-label:before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#b396eb;margin-right:8px;vertical-align:middle}.center{position:absolute;inset:19% 12% 18%;display:flex;align-items:center;justify-content:center;text-align:center}.center-inner{max-width:560px}.mark{width:clamp(36px,6.2cqw,64px);height:clamp(36px,6.2cqw,64px);margin:0 auto 3%;border:1px solid #8f72c4;border-radius:30%;display:grid;place-items:center;background:linear-gradient(145deg,#413558,#211a31);box-shadow:0 0 45px #8663bd35;transform:rotate(-8deg)}.mark span{font-size:clamp(20px,3.3cqw,34px);font-weight:800;color:#dfcbff;transform:rotate(8deg);line-height:1}.eyebrow{color:#b79cdd;font-weight:700;margin-bottom:2%}.center h1{font-size:clamp(23px,4.1cqw,42px);letter-spacing:-.04em;margin:0 0 2%;font-weight:700}.center p{font-size:clamp(10px,1.4cqw,14px);line-height:1.8;color:#a9a4b5;margin:0}.divider{width:36px;height:2px;background:#9b7aca;margin:4% auto}.footer{position:absolute;bottom:8%;left:4.4%;right:4.4%;display:flex;justify-content:space-between;color:#706b7d;letter-spacing:.08em}.switcher{position:fixed;z-index:10;right:16px;bottom:14px;display:flex;align-items:center;gap:2px;padding:3px;border:1px solid #ffffff1c;border-radius:24px;background:#1d1b27a8;opacity:.35;transition:opacity .2s;backdrop-filter:blur(12px)}.switcher:hover,.switcher:focus-within{opacity:1}.switcher button{border:0;border-radius:20px;color:#bbb6c8;background:transparent;width:27px;height:27px;padding:6px;display:grid;place-items:center;cursor:pointer}.switcher svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.switcher button[aria-pressed=true]{background:#ebe3fa;color:#23192f}.document{display:none;min-height:100vh;background:#f6f5f8;color:#25232c;padding:70px 24px 100px}.document.active{display:block}.document-shell{max-width:860px;margin:auto}.doc-header{border-bottom:1px solid #dedbe4;padding-bottom:26px;margin-bottom:34px}.doc-kicker{color:#8461ad;font-size:11px;font-weight:700;letter-spacing:.15em}.doc-header h1{font-size:32px;letter-spacing:-.04em;margin:10px 0 8px}.doc-header p{color:#85808e;font-size:13px;margin:0}.markdown{font-size:15px;line-height:1.85;overflow-wrap:anywhere}.markdown h1,.markdown h2,.markdown h3,.markdown h4{line-height:1.35;margin:1.8em 0 .6em;color:#25212d}.markdown h1{font-size:28px}.markdown h2{font-size:22px;border-bottom:1px solid #e4e1e8;padding-bottom:10px}.markdown h3{font-size:18px}.markdown p,.markdown ul,.markdown ol,.markdown blockquote,.markdown pre{margin:.8em 0}.markdown a{color:#7450a0}.markdown blockquote{border-left:3px solid #bb9ad8;padding-left:16px;color:#777080}.markdown code{background:#edeaf1;padding:2px 5px;border-radius:4px}.markdown pre{background:#24212d;color:#eee;padding:16px;overflow:auto;border-radius:8px}.markdown pre code{background:none;padding:0}.markdown table{border-collapse:collapse;width:100%;display:block;overflow:auto}.markdown th,.markdown td{border:1px solid #dedbe4;padding:8px 12px;text-align:left}.markdown hr{border:0;border-top:1px solid #dedbe4;margin:2em 0}.error{padding:20px;background:#fff;border:1px solid #ead3d3;border-radius:8px;color:#8b4545}.portrait-tip{display:none}@media(orientation:portrait){.portrait-tip{display:block;position:fixed;top:calc(16px + env(safe-area-inset-top));left:0;right:0;text-align:center;color:#aaa3b6;font-size:12px;letter-spacing:.04em}.prototype{min-height:100dvh}}@media(max-width:550px){.document{padding:42px 20px 90px}.doc-header h1{font-size:26px}}
.lobby-entries{position:absolute;right:3%;bottom:6%;width:48%;display:flex;flex-direction:column;gap:2cqw}.games-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7cqw}.game-entry,.category-entry{display:block;min-width:0;padding:0;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;line-height:0}.game-entry:focus-visible,.category-entry:focus-visible,.back:focus-visible{outline:3px solid white;outline-offset:2px}.game-entry{aspect-ratio:1.12;filter:drop-shadow(0 3px 3px #5c260b66)}.game-entry img{width:100%;height:100%;object-fit:contain}.categories-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.5cqw;align-items:center}.category-entry img{width:100%;aspect-ratio:1.3;object-fit:contain;filter:drop-shadow(0 2px 2px #78370e55)}.detail{position:absolute;inset:0;background:#fff;display:none}.detail.active{display:block}.back{position:absolute;top:5%;left:3%;width:clamp(28px,4cqw,42px);aspect-ratio:1;border:0;border-radius:50%;background:#f1f1f1;color:#333;font-size:clamp(18px,2.8cqw,28px);line-height:1;cursor:pointer}.stage.detail-open{background:#fff}.stage.detail-open:before{display:none}.stage.detail-open .lobby-entries{display:none}

.lobby-header{position:absolute;z-index:2;top:2%;left:2%;right:2%;height:12%;display:flex;align-items:center;gap:1.2cqw;color:#fff;text-shadow:0 1px 2px #44290d80}.profile{display:flex;align-items:center;gap:.65cqw;min-width:19%;padding:.25cqw .8cqw .25cqw .25cqw;border:1px solid #ffffff70;border-radius:3cqw;background:#6e3a18b8;box-shadow:inset 0 1px #ffffff33}.avatar{flex:none;width:5cqw;height:5cqw;border:.25cqw solid #ffe28a;border-radius:50%;background:linear-gradient(150deg,#ffe8aa,#f5a43e);box-shadow:0 2px 5px #53310e66;overflow:hidden}.avatar svg{width:100%;height:100%}.profile-info{min-width:0;line-height:1.25}.profile-name{font-size:1.55cqw;font-weight:800;white-space:nowrap}.profile-id{font-size:1.02cqw;font-weight:600;opacity:.92;white-space:nowrap}.notice{flex:1;min-width:0;height:3.6cqw;display:flex;align-items:center;gap:.65cqw;padding:0 1cqw;border:1px solid #ffffff70;border-radius:3cqw;background:#6e3a1880;box-shadow:inset 0 1px #ffffff33}.notice svg{width:1.7cqw;height:1.7cqw;flex:none;fill:#ffe590}.ticker-window{overflow:hidden;flex:1;min-width:0}.ticker-track{display:flex;width:max-content;animation:ticker 19s linear infinite}.ticker-track span{font-size:1.1cqw;font-weight:700;white-space:nowrap;padding-right:4cqw}@keyframes ticker{to{transform:translateX(-50%)}}.header-actions{display:flex;align-items:center;gap:.7cqw}.balance{height:3.7cqw;display:flex;align-items:center;gap:.55cqw;padding:.25cqw .35cqw .25cqw .3cqw;border:1px solid #ffdd86;border-radius:3cqw;background:#65390bbb;box-shadow:inset 0 1px #ffffff55}.coin{width:3cqw;height:3cqw;display:grid;place-items:center;flex:none;border:.22cqw solid #ffe794;border-radius:50%;color:#9a4a00;background:linear-gradient(#ffe981,#ffb71f);font-size:1.8cqw;font-weight:900;text-shadow:0 1px #fff4a0}.balance-value{font-size:1.35cqw;font-weight:850;white-space:nowrap}.top-action,.add-balance{padding:0;display:grid;place-items:center;flex:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.add-balance{width:2.8cqw;height:2.8cqw;border:.16cqw solid #fff0a0;border-radius:50%;background:linear-gradient(#91e750,#2eb34a);box-shadow:0 2px 2px #35210780;color:#fff;font-size:2.3cqw;font-weight:800;line-height:1;text-shadow:0 1px 2px #237826}.top-action{width:3.8cqw;height:3.8cqw;border:.16cqw solid #ffe39a;border-radius:50%;background:linear-gradient(#eab44f,#a85c17);box-shadow:0 2px 3px #51300d80;color:#fff4d6}.top-action svg{width:2.15cqw;height:2.15cqw;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.stage.detail-open .lobby-header{display:none}@media(prefers-reduced-motion:reduce){.ticker-track{animation:none}}

<body>
<main id="prototype" class="prototype">
  <div class="portrait-tip">旋转手机，获得最佳横屏体验</div>
  <section class="stage" aria-label="Filplay 移动端原型画布">
    <header class="lobby-header" aria-label="用户信息与公告">
      <div class="profile"><div class="avatar" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="19" r="9" fill="#fff5dd"/><path d="M6 48c1-12 8-19 18-19s17 7 18 19" fill="#fff5dd"/></svg></div><div class="profile-info"><div class="profile-name">axing</div><div class="profile-id">ID: 10000001</div></div></div>
      <div class="notice" aria-label="平台公告"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l7 4V5L7 9H3zm13-1.5a5 5 0 0 1 0 9v-2.4a2.8 2.8 0 0 0 0-4.2V7.5zM6 16l1.5 4h3L9 16H6z"/></svg><div class="ticker-window"><div class="ticker-track"><span>Welcome to Filplay! Discover your favorite games and enjoy the fun.</span><span aria-hidden="true">Welcome to Filplay! Discover your favorite games and enjoy the fun.</span></div></div></div>
      <div class="header-actions"><div class="balance" aria-label="余额 1,000.00 比索"><span class="coin" aria-hidden="true">₱</span><span class="balance-value">1,000.00</span><button class="add-balance" type="button" aria-label="充值">+</button></div><button class="top-action" type="button" aria-label="客服"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13v-2a8 8 0 0 1 16 0v2M4 12H3v5h3v-5H4zm16 0h1v5h-3v-5h2zm0 5c0 2-2 3-5 3h-2"/></svg></button><button class="top-action" type="button" aria-label="站内信"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg></button></div>
    </header>
    <div class="lobby-entries"><div class="games-grid" aria-label="热门游戏"><a class="game-entry" href="#/game/1" aria-label="Fortune Treasures"><img src="assets/game1-clean.png" alt=""></a><a class="game-entry" href="#/game/2" aria-label="Super Ace"><img src="assets/game2-clean.png" alt=""></a><a class="game-entry" href="#/game/3" aria-label="Gold Miner"><img src="assets/game3-clean.png" alt=""></a><a class="game-entry" href="#/game/4" aria-label="Lucky Slots"><img src="assets/game4-clean.png" alt=""></a><a class="game-entry" href="#/game/5" aria-label="777"><img src="assets/game5-clean.png" alt=""></a><a class="game-entry" href="#/game/6" aria-label="Sugar Rush"><img src="assets/game6-clean.png" alt=""></a></div><div class="categories-grid" aria-label="热门分类"><a class="category-entry" href="#/category/slot" aria-label="Slot"><img src="assets/Slot-clean.png" alt=""></a><a class="category-entry" href="#/category/casino" aria-label="Casino"><img src="assets/Casino-clean.png" alt=""></a><a class="category-entry" href="#/category/poker" aria-label="Poker"><img src="assets/Poker-clean.png" alt=""></a><a class="category-entry" href="#/category/arcade" aria-label="Arcade"><img src="assets/Arcade-clean.png" alt=""></a><a class="category-entry" href="#/category/bingo" aria-label="Bingo"><img src="assets/Bingo-clean.png" alt=""></a><a class="category-entry" href="#/category/fishing" aria-label="Fishing"><img src="assets/Fishing-clean.png" alt=""></a></div></div>
    <div class="detail" aria-label="详情页"><a class="back" href="#/" aria-label="返回大厅">&#8249;</a></div>

<main id="document" class="document" aria-label="需求文档"><div class="document-shell"><header class="doc-header"><div class="doc-kicker">FILPLAY MOBILE / DOCUMENTATION</div><h1>产品需求文档</h1><p>项目统一需求文档 · requirement.md</p></header><article id="content" class="markdown" aria-live="polite">正在加载需求文档…</article></div></main>
<nav class="switcher" aria-label="视图模式"><button type="button" data-mode="prototype" aria-pressed="true" aria-label="原型模式" title="原型模式"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg></button><button type="button" data-mode="document" aria-pressed="false" aria-label="文档模式" title="文档模式"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v5h4M9 12h7M9 16h7"/></svg></button></nav>
<script>
function updateRoute(){const detail=/^#\/(game|category)\/[^/]+/.test(location.hash);document.querySelector('.stage').classList.toggle('detail-open',detail);document.querySelector('.detail').classList.toggle('active',detail);}
window.addEventListener('hashchange',updateRoute);updateRoute();
// Markdown is rendered as text first, so content in the requirement file cannot execute HTML.
const content = document.querySelector('#content');
const escapeHtml = text => text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function inline(text){return escapeHtml(text).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|\/[^\s)]*|#[^\s)]*)\)/g,'<a href="$2" rel="noopener noreferrer">$1</a>');}
function renderMarkdown(source){
 const lines=source.replace(/\r\n?/g,'\n').split('\n'); let html='', list='', code=false, codeLines=[], paragraph=[];
 const flush=()=>{if(paragraph.length){html+='<p>'+paragraph.map(inline).join('<br>')+'</p>';paragraph=[];}};
 const closeList=()=>{if(list){html+='</'+list+'>';list='';}};
 for(let i=0;i<lines.length;i++){const line=lines[i];
  if(/^\s*```/.test(line)){flush();closeList();if(code){html+='<pre><code>'+escapeHtml(codeLines.join('\n'))+'</code></pre>';codeLines=[];}code=!code;continue;}
  if(code){codeLines.push(line);continue;}
  if(!line.trim()){flush();closeList();continue;}
  const heading=line.match(/^(#{1,6})\s+(.+)$/);if(heading){flush();closeList();const level=heading[1].length;html+=`<h${level}>${inline(heading[2])}</h${level}>`;continue;}
  if(/^\s*(---+|\*\*\*+)\s*$/.test(line)){flush();closeList();html+='<hr>';continue;}
  if(line.includes('|') && i+1<lines.length && /^\s*\|?\s*:?-{3,}/.test(lines[i+1])){flush();closeList();const cells=s=>s.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());const head=cells(line);i++;let rows='';while(i+1<lines.length && lines[i+1].includes('|') && lines[i+1].trim()){rows+='<tr>'+cells(lines[++i]).map(x=>'<td>'+inline(x)+'</td>').join('')+'</tr>';}html+='<table><thead><tr>'+head.map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table>';continue;}
  const item=line.match(/^\s*(?:([-*+])\s+|(\d+)\.\s+)(.*)$/);if(item){flush();const type=item[2]?'ol':'ul';if(list!==type){closeList();list=type;html+='<'+type+'>';}html+='<li>'+inline(item[3])+'</li>';continue;}
  const quote=line.match(/^\s*>\s?(.*)$/);if(quote){flush();closeList();html+='<blockquote>'+inline(quote[1])+'</blockquote>';continue;}
  closeList();paragraph.push(line);
 }
 flush();closeList();if(code)html+='<pre><code>'+escapeHtml(codeLines.join('\n'))+'</code></pre>';return html;
}
async function loadRequirement(){content.textContent='正在加载需求文档…';try{const response=await fetch(new URL('requirement.md',document.baseURI),{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);content.innerHTML=renderMarkdown(await response.text());}catch(error){content.innerHTML='<div class="error">无法加载 requirement.md。请通过网页服务器访问，并确认文件已部署到项目根目录。</div>';}}
function setMode(mode){const isDoc=mode==='document';document.querySelector('#prototype').hidden=isDoc;document.querySelector('#prototype').style.display=isDoc?'none':'';document.querySelector('#document').classList.toggle('active',isDoc);document.querySelectorAll('[data-mode]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.mode===mode)));if(isDoc)loadRequirement();}
document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>setMode(button.dataset.mode)));
</script>
